name: Deploy to production

# Fires when you publish a GitHub Release (Releases → Draft a new release →
# Publish, from whatever commit is currently on staging and has been
# verified there) — never on a raw push. If the "production" Environment
# (Settings → Environments) has required reviewers configured, this run
# pauses for that approval before touching anything.
on:
  release:
    types: [published]

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: ${{ github.event.release.tag_name }}
    secrets: inherit
