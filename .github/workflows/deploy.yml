name: Deploy (reusable)

# Shared by deploy-staging.yml (push to main) and deploy-production.yml
# (published release) — same build→push→migrate→deploy sequence as
# infra/deploy.sh, just running in CI via Workload Identity Federation
# instead of your own gcloud login. Not triggered directly; only via
# `workflow_call` from those two files.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Selects this environment's GitHub Environment (Settings → Environments)
    # — that's what scopes the secrets/vars below to staging vs production,
    # and (if you add required reviewers on the "production" Environment)
    # what gives production its manual-approval gate.
    environment: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write # required for google-github-actions/auth's OIDC exchange — no service account key involved

    env:
      APP_NAME: zappy
      REGION: ${{ vars.GCP_REGION || 'southamerica-east1' }}
      REPO: ${{ vars.GCP_REGION || 'southamerica-east1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/zappy-${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      # Exchanges this workflow run's OIDC token for a short-lived GCP
      # access token — only possible because modules/zappy/wif.tf's
      # attribute_condition matches this exact repo + this exact
      # Environment name. Nothing here is a long-lived credential.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build web service image
        run: |
          docker build \
            --target runner \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.APP_URL }}" \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${{ vars.STRIPE_PUBLISHABLE_KEY }}" \
            -f apps/web/Dockerfile \
            -t "${{ env.REPO }}/web:${{ inputs.image_tag }}" \
            .

      - name: Build migration job image
        run: |
          docker build \
            --target build \
            -f apps/web/Dockerfile \
            -t "${{ env.REPO }}/web:build-${{ inputs.image_tag }}" \
            .

      - name: Push images
        run: |
          docker push "${{ env.REPO }}/web:${{ inputs.image_tag }}"
          docker push "${{ env.REPO }}/web:build-${{ inputs.image_tag }}"

      - name: Run migrations
        run: |
          gcloud run jobs update "${{ env.APP_NAME }}-${{ inputs.environment }}-migrate" \
            --project "${{ secrets.GCP_PROJECT_ID }}" --region "${{ env.REGION }}" \
            --image "${{ env.REPO }}/web:build-${{ inputs.image_tag }}"
          gcloud run jobs execute "${{ env.APP_NAME }}-${{ inputs.environment }}-migrate" \
            --project "${{ secrets.GCP_PROJECT_ID }}" --region "${{ env.REGION }}" --wait

      - name: Deploy web service
        run: |
          gcloud run deploy "${{ env.APP_NAME }}-${{ inputs.environment }}-web" \
            --project "${{ secrets.GCP_PROJECT_ID }}" --region "${{ env.REGION }}" \
            --image "${{ env.REPO }}/web:${{ inputs.image_tag }}"
